<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>{{ document_title }}</title>
    <style>
      /* Estilo comercial: misma paleta monocromática de la landing. */
      @page {
        size: A4;
        margin: 0;
      }

      body {
        font-family: Helvetica, Arial, sans-serif;
        font-size: 9.5pt;
        line-height: 1.65;
        color: #e6e6e6;
        background: #121212;
        margin: 0;
        padding: 15mm 16mm 12mm 16mm;
      }

      .letterhead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid #232323;
        padding-bottom: 10px;
        margin-bottom: 18px;
      }
      .brand { display: flex; align-items: center; gap: 10px; }
      .brand-mark {
        width: 34px; height: 34px; border-radius: 50%;
        display: block;
      }
      .brand-name { font-size: 13pt; font-weight: bold; color: #e6e6e6; }
      .brand-tagline {
        font-size: 6.5pt; letter-spacing: 1.4px; color: #a0a0a0; text-transform: uppercase;
      }
      .doc-title {
        font-size: 10pt; font-weight: bold; text-transform: uppercase;
        letter-spacing: 0.4px; text-align: right; color: #e6e6e6;
      }

      h2 {
        font-size: 8.5pt; font-weight: bold; text-transform: uppercase;
        letter-spacing: 1.4px; color: #a0a0a0;
        margin: 16px 0 0; padding-bottom: 5px;
        border-bottom: 1px solid #232323;
      }
      h2 + p, h2 + ul, h2 + table { margin-top: 8px; }
      p { margin: 0 0 7px; }
      strong { color: #e6e6e6; font-weight: bold; }
      ul { margin: 0 0 9px; padding-left: 16px; }
      li { margin-bottom: 5px; }
      a { color: #e6e6e6; }

      table.data {
        width: 100%; border-collapse: collapse; margin-top: 10px;
        page-break-inside: avoid;
      }
      table.data th {
        background: #181818; border: 1px solid #232323;
        padding: 8px 10px; text-align: left; font-size: 9pt; color: #e6e6e6;
      }
      table.data td {
        border: 1px solid #232323; padding: 8px 10px;
        font-size: 9pt; color: #a0a0a0;
      }

      .footer {
        margin-top: 18px; padding-top: 9px;
        border-top: 1px solid #232323;
        font-size: 7.5pt; color: #a0a0a0;
        display: flex; justify-content: space-between;
      }
    </style>
  </head>
  <body>
    <div class="letterhead">
      <div class="brand">
        {% if kibo.logo %}<img class="brand-mark" src="{{ kibo.logo }}" alt="" />{% endif %}
        <div>
          <div class="brand-name">KiboCode<span style="color:#a0a0a0">.</span></div>
          <div class="brand-tagline">Software a medida</div>
        </div>
      </div>
      <div class="doc-title">{{ document_title }}</div>
    </div>

    {{ content }}

    <div class="footer">
      <span>KiboCode — Software a medida</span>
      <span>wa.me/{{ kibo.whatsapp_plain }} · {{ kibo.email }}</span>
    </div>
  </body>
</html>
