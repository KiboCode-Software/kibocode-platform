<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>{{ document_title }}</title>
    <style>
      @page {
        size: A4;
        margin: 18mm 16mm 20mm 16mm;
        @bottom-left {
          content: "KiboCode — Software a medida";
          font-family: Helvetica, Arial, sans-serif;
          font-size: 7.5pt;
          color: #8a8a8a;
        }
        @bottom-right {
          content: "wa.me/{{ kibo.whatsapp_plain }} · {{ kibo.email }}";
          font-family: Helvetica, Arial, sans-serif;
          font-size: 7.5pt;
          color: #8a8a8a;
        }
      }

      body {
        font-family: Helvetica, Arial, sans-serif;
        font-size: 9.5pt;
        line-height: 1.65;
        color: #1f1f1f;
        margin: 0;
      }

      .letterhead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 2px solid #1f1f1f;
        padding-bottom: 10px;
        margin-bottom: 22px;
      }
      .brand { display: flex; align-items: center; gap: 10px; }
      .brand-mark {
        width: 34px; height: 34px; border-radius: 50%;
        display: block;
      }
      .brand-name { font-size: 13pt; font-weight: bold; color: #111; }
      .brand-tagline {
        font-size: 6.5pt; letter-spacing: 1.4px; color: #8a8a8a; text-transform: uppercase;
      }
      .doc-title {
        font-size: 10pt; font-weight: bold; text-transform: uppercase;
        letter-spacing: 0.4px; text-align: right;
      }

      h2 {
        font-size: 9.5pt; font-weight: bold; text-transform: uppercase;
        letter-spacing: 0.3px; margin: 20px 0 0;
        padding-bottom: 5px; border-bottom: 1px solid #e0e0e0;
      }
      h2 + p, h2 + ul, h2 + table { margin-top: 9px; }
      p { margin: 0 0 9px; text-align: justify; }
      strong { font-weight: bold; }
      ul { margin: 0 0 9px; padding-left: 16px; }
      li { margin-bottom: 4px; text-align: justify; }

      .meta { margin-bottom: 4px; }
      .divider { border: 0; border-top: 1px solid #e0e0e0; margin: 18px 0; }

      table.signatures {
        width: 100%; border-collapse: collapse; margin-top: 14px;
        page-break-inside: avoid;
      }
      table.signatures th {
        background: #f5f5f5; border: 1px solid #dcdcdc;
        padding: 8px 10px; text-align: left; font-size: 9pt;
      }
      table.signatures td {
        border: 1px solid #dcdcdc; padding: 8px 10px; font-size: 9pt;
      }
      .checklist { list-style: none; padding-left: 0; }
      .checklist li::before { content: "[  ]  "; font-family: monospace; }
    </style>
  </head>
  <body>
    <div class="letterhead">
      <div class="brand">
        {% if kibo.logo %}<img class="brand-mark" src="{{ kibo.logo }}" alt="" />{% endif %}
        <div>
          <div class="brand-name">KiboCode<span style="color:#8a8a8a">.</span></div>
          <div class="brand-tagline">Software a medida</div>
        </div>
      </div>
      <div class="doc-title">{{ document_title }}</div>
    </div>

    {{ content }}
  </body>
</html>
