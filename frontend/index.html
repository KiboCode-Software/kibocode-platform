<!doctype html>
<!-- Español neutro, no de un país: el sitio se dirige a empresas de
     cualquier lugar. -->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      El título, la descripción, las etiquetas sociales y los datos
      estructurados los inyecta `vite-seo-plugin.js` desde
      `src/config/seo.config.js`. No los dupliques aquí.

      Este título es solo el de respaldo (el que ve el servidor de desarrollo);
      debe coincidir con `seo.pages` para no dar dos mensajes distintos.
    -->
    <title>KiboCode | Desarrollo de software a medida para empresas</title>

    <!-- El isotipo es vectorial; el PNG de 512 px queda como respaldo y para
         iOS, que no acepta SVG en el icono de la pantalla de inicio. -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" sizes="512x512" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#0f0f0f" />

    <!--
      Archivo con el eje de ancho (wdth 75–125): el mismo tipo sirve de
      titular expandido y de texto de lectura. IBM Plex Mono es la capa de
      datos — altitudes, cifras, terminal.

      La tipografía es lo primero que se pinta: se preconecta para no
      retrasar el render y no penalizar las métricas de carga.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,300..800&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
