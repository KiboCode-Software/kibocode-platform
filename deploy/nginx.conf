# nginx para KiboCode en EC2.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/kibocode
#   sudo ln -s /etc/nginx/sites-available/kibocode /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# El bloque TLS lo agrega certbot automáticamente:
#   sudo certbot --nginx -d kibocode.lat -d www.kibocode.lat

upstream kibocode_backend {
    server 127.0.0.1:8000 fail_timeout=0;
}

# `www` redirige al dominio sin prefijo. Servir el mismo sitio en las dos
# direcciones divide la autoridad de posicionamiento entre ambas y contradice
# la URL canónica que declara el HTML.
server {
    listen 80;
    listen [::]:80;
    server_name www.kibocode.lat;
    return 301 https://kibocode.lat$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name kibocode.lat;

    # Frontend compilado (npm run build → frontend/dist/)
    root /srv/kibocode/frontend/dist;
    index index.html;

    client_max_body_size 10M;

    # Compresión: el bundle de React y las respuestas JSON lo agradecen.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://kibocode_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Sin esto Django no sabe que la petición original venía por HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;

        # La generación de PDF puede tardar unos segundos.
        proxy_read_timeout 120s;
        proxy_redirect off;
    }

    # Admin de Django y sus estáticos (los sirve WhiteNoise).
    location /admin/ {
        proxy_pass http://kibocode_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://kibocode_backend;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
    }

    # --- Frontend ----------------------------------------------------------
    # Los assets con hash en el nombre pueden cachearse indefinidamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html NUNCA se cachea: es quien apunta a los assets nuevos
    # después de cada despliegue.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Fallback SPA: sin esto, entrar directo a /plataforma o /privacidad da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
